<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 28" width="100%" height="28" fill="none">
  <defs>
    <!-- Dark Mode Fading Hairline (Swiss Amber #FFB86C) -->
    <linearGradient id="div-fade-dark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="15%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#FFB86C" stop-opacity="0.95" />
      <stop offset="85%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- Light Mode Fading Hairline (Swiss Amber #B45309) -->
    <linearGradient id="div-fade-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0" />
      <stop offset="15%" stop-color="#0f172a" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#B45309" stop-opacity="0.9" />
      <stop offset="85%" stop-color="#0f172a" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </linearGradient>
  </defs>

  <style>
    /* DARK MODE (Default) - Swiss Amber #FFB86C */
    .line-primary {
      stroke: url(#div-fade-dark);
      stroke-width: 1.1;
      fill: none;
      stroke-linecap: round;
    }
    .line-echo {
      stroke: rgba(255,255,255,0.18);
      stroke-width: 0.8;
      fill: none;
      stroke-dasharray: 4 4;
      stroke-linecap: round;
    }
    .photon { fill: #FFB86C; filter: drop-shadow(0 0 4px rgba(255, 184, 108, 0.8)); }
    .center-node { fill: none; stroke: #FFB86C; stroke-width: 1.1; }
    .center-core { fill: #ffffff; }

    /* LIGHT MODE - Swiss Amber #B45309 */
    @media (prefers-color-scheme: light) {
      .line-primary { stroke: url(#div-fade-light) !important; }
      .line-echo { stroke: rgba(0,0,0,0.12) !important; }
      .photon { fill: #B45309 !important; filter: drop-shadow(0 0 3px rgba(180, 83, 9, 0.5)) !important; }
      .center-node { stroke: #B45309 !important; }
      .center-core { fill: #0f172a !important; }
    }

    @keyframes pulseNode {
      0%, 100% { transform: scale(1); opacity: 0.7; }
      50% { transform: scale(1.25); opacity: 1; }
    }
    .anim-node {
      transform-origin: 460px 14px;
      animation: pulseNode 3s ease-in-out infinite;
    }
  </style>

  <!-- Secondary Phase-shifted Wave Echo -->
  <path class="line-echo">
    <animate attributeName="d" dur="6.5s" repeatCount="indefinite"
      values="
        M 100,14 L 370,14 C 400,14 415,20 430,8 C 445,20 460,8 475,20 C 490,8 505,20 520,14 L 820,14;
        M 100,14 L 370,14 C 400,14 415,8 430,20 C 445,8 460,20 475,8 C 490,20 505,8 520,14 L 820,14;
        M 100,14 L 370,14 C 400,14 415,20 430,8 C 445,20 460,8 475,20 C 490,8 505,20 520,14 L 820,14
      "
      calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1" />
  </path>

  <!-- Primary Acoustic Wavelet Hairline -->
  <path class="line-primary">
    <animate attributeName="d" dur="6.5s" repeatCount="indefinite"
      values="
        M 20,14 L 360,14 C 395,14 415,6 435,22 C 450,6 460,22 475,6 C 495,22 515,14 560,14 L 900,14;
        M 20,14 L 360,14 C 395,14 415,22 435,6 C 450,22 460,6 475,22 C 495,6 515,14 560,14 L 900,14;
        M 20,14 L 360,14 C 395,14 415,6 435,22 C 450,6 460,22 475,6 C 495,22 515,14 560,14 L 900,14
      "
      calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1" />
  </path>

  <!-- Center Breathing Acoustic Singularity Node -->
  <g class="anim-node">
    <circle cx="460" cy="14" r="3" class="center-node" />
    <circle cx="460" cy="14" r="1.2" class="center-core" />
  </g>

  <!-- Traveling Photon -->
  <circle r="1.8" class="photon">
    <animateMotion dur="6.5s" repeatCount="indefinite"
      path="M 20,14 L 360,14 C 395,14 415,6 435,22 C 450,6 460,22 475,6 C 495,22 515,14 560,14 L 900,14" />
    <animate attributeName="opacity" values="0; 0.95; 0.95; 0" dur="6.5s" repeatCount="indefinite" />
  </circle>
</svg>
